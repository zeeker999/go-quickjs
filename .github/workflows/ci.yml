name: CI

# A change to documentation alone builds and tests nothing: CI runs when
# anything else changes, with the documentation or without it.
on:
  push:
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format and vet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The newest Go: gofmt parses every file, the ones only a newer Go
      # builds too -- generic methods, behind //go:build go1.27 -- which an
      # older gofmt cannot.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "The following files need gofmt:"
            echo "$files"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test -count=1 ./...

  newest:
    # The module builds with the Go go.mod names, which the jobs above test;
    # this one tests what only a newer Go builds as well.
    name: Test (Go 1.27)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Run tests
        run: go test -count=1 ./...

  native-boundary:
    name: Native boundary (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
        go: ["1.24", "1.27"]
    env:
      CGO_ENABLED: "0"
      QUICKJS_REQUIRE_JIT: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Check native code and assembly
        run: go vet -tags quickjs_jit ./internal/jit/... ./internal/vm

      - name: Exercise native execution
        run: |
          go test -tags quickjs_jit -count=1 -timeout=5m ./internal/jit/...
          go test -tags quickjs_jit -count=1 -timeout=10m ./internal/vm . -run 'JIT|Native'

      - name: Check native pointer lifetimes
        run: go test -tags quickjs_jit -gcflags=all=-d=checkptr=2 -count=1 -timeout=10m ./internal/jit/... ./internal/vm . -run 'JIT|Native|Program|Validate|Lower'

      # Both emitters' code, for every target, against golang.org/x/arch's
      # disassemblers: a module of its own, so go-quickjs never depends on it.
      - name: Check encodings
        working-directory: internal/jit/verify
        run: go test -tags quickjs_jit -count=1 ./...

  # test262 with the JIT made to compile on the first call, return to Go
  # every few instructions and fall back to the interpreter from wherever it
  # got to (QJS_JIT_STRESS, internal/vm). The runner fails a run in which no
  # test ran native code.
  jit-conformance:
    name: JIT test262 under stress (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    env:
      CGO_ENABLED: "0"
      QUICKJS_REQUIRE_JIT: "1"
      QJS_JIT_STRESS: threshold,budget=3,deopt=7
    steps:
      # test262 counts a source's bytes and line terminators: keep its LFs on
      # Windows.
      - name: Keep line endings
        run: git config --global core.autocrlf false

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out test262
        uses: actions/checkout@v4
        with:
          repository: tc39/test262
          ref: 7ab7fafa0003f73fc85c1b95d88094d33f7eb8bd
          path: test262

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Run test262
        shell: bash
        run: TEST262_DIR="$GITHUB_WORKSPACE/test262" go test -tags quickjs_jit ./conformance -run TestConformance -count=1 -timeout 35m -args -conformance.jit

      # The new pipeline (docs/jit-phase2-design.md), wherever it compiles a
      # function: amd64 on Linux and Windows, arm64 on macOS.
      - name: Run test262 on the new pipeline
        shell: bash
        env:
          QJS_JIT_PIPELINE: ssa
        run: TEST262_DIR="$GITHUB_WORKSPACE/test262" go test -tags quickjs_jit ./conformance -run TestConformance -count=1 -timeout 35m -v -args -conformance.jit 2>&1 | tee test262-ssa.log | grep -E "test262:|native code ran|of those entries|FAIL|^ok"; test "${PIPESTATUS[0]}" -eq 0

  # Generated programs, run in the interpreter, the tree tier and the JIT
  # under stress, must give the same answer.
  jit-fuzz:
    name: JIT differential fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: "0"
      QUICKJS_REQUIRE_JIT: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Fuzz
        run: go test -tags quickjs_jit ./internal/vm -run '^$' -fuzz '^FuzzJITDifferential$' -fuzztime=5m

  race:
    name: Race detector
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test runtimes sharing go-intl's data
        run: go test -race -count=1 -run TestIntlConcurrentRuntimes .
