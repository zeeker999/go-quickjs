name: winflake

on:
  push:

permissions:
  contents: read

jobs:
  flake:
    name: TestMirAnnotated loop (${{ matrix.run }}, ${{ matrix.debug }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3, 4, 5, 6]
        debug: ["none", "cpu.avx512f=off"]
    env:
      CGO_ENABLED: "0"
      QUICKJS_REQUIRE_JIT: "1"
    steps:
      - name: Machine
        shell: pwsh
        run: |
          $p = Get-CimInstance Win32_Processor
          "CPU: " + $p.Name + " | " + $p.Caption
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: Loop
        working-directory: internal/jit/verify
        shell: bash
        run: |
          if [ "${{ matrix.debug }}" != "none" ]; then export GODEBUG="${{ matrix.debug }}"; fi
          echo "GODEBUG=$GODEBUG"
          go test -tags quickjs_jit -c -o verify.test.exe .
          fails=0
          for i in $(seq 1 20); do
            if ! ./verify.test.exe -test.run 'TestMirAnnotated' -test.count=1 > out.txt 2>&1; then
              fails=$((fails+1)); echo "run $i FAILED"; grep -E "fault|panic|unsupported|ssa.go|annotate" out.txt | head -8
            fi
          done
          echo "FAILS=$fails/20"
          ./verify.test.exe -test.count=1 > all.txt 2>&1 && echo "full package: ok" || { echo "full package: FAILED"; grep -E "fault|panic|FAIL|ssa.go" all.txt | head -8; }
