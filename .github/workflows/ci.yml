name: winflake4

on:
  push:

permissions:
  contents: read

jobs:
  native-boundary:
    name: Native boundary (${{ matrix.os }}, Go ${{ matrix.go }}, ${{ matrix.copy }}, preempt ${{ matrix.preempt }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        copy: [1, 2, 3, 4]
        preempt: ["on", "off"]
        go: ["1.24"]
    env:
      CGO_ENABLED: "0"
      QUICKJS_REQUIRE_JIT: "1"
    steps:
      # The machine, first, which a failure on a Windows runner needs:
      # a few of them have met corrupted memory ("found pointer to free
      # object") in the steps below, in Check encodings and in Exercise
      # native execution, which no other runner has in a thousand runs.
      - name: Machine
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Get-CimInstance Win32_Processor
          "CPU: " + $p.Name + " | " + $p.Caption
          "OS: " + (Get-CimInstance Win32_OperatingSystem).Version

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Check native code and assembly
        run: go vet -tags quickjs_jit ./internal/jit/... ./internal/vm

      - name: Exercise native execution
        run: |
          go test -tags quickjs_jit -count=1 -timeout=5m ./internal/jit/...
          go test -tags quickjs_jit -count=1 -timeout=10m ./internal/vm . -run 'JIT|Native'

      # The compiler's cross-checks: liveness against its reference, the
      # origins and stores' checks it keeps against those made afresh.
      - name: Check the compiler against its references
        run: go test -tags quickjs_jit,quickjs_verify -count=1 -timeout=10m ./internal/jit/... ./internal/vm -run 'JIT|Native|SSA|Optimize|Build|Live'

      - name: Check native pointer lifetimes
        run: go test -tags quickjs_jit -gcflags=all=-d=checkptr=2 -count=1 -timeout=10m ./internal/jit/... ./internal/vm . -run 'JIT|Native|Program|Validate|Lower'

      # Both emitters' code, for every target, against golang.org/x/arch's
      # disassemblers: a module of its own, so go-quickjs never depends on it.
      - name: Check encodings
        working-directory: internal/jit/verify
        shell: bash
        run: |
          if [ "${{ matrix.preempt }}" = "off" ]; then export GODEBUG=asyncpreemptoff=1; fi
          echo "GODEBUG=$GODEBUG"
          fails=0
          for i in 1 2 3 4 5; do
            if ! go test -tags quickjs_jit -count=1 ./... > out.txt 2>&1; then
              fails=$((fails+1)); echo "round $i FAILED"; grep -aE "fatal|fault|unsupported|FAIL:|ssa.go|bad " out.txt | head -6
            fi
          done
          echo "FAILS=$fails/5"

  # test262 with the JIT made to compile on the first call, poll Go every
  # few back edges and finish in the interpreter from wherever it got to
  # (QJS_JIT_STRESS, internal/vm). The runner fails a run in which no
  # test ran native code.