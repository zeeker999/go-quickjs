name: winflake3

on:
  push:

permissions:
  contents: read

jobs:
  flake:
    name: verify loop (${{ matrix.ref }}, ${{ matrix.copy }})
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        ref: [6ce64844d2a816915bdc9d78731648dc448f9b42, 3205082f666436602e49c425840eb40cab4767aa, 48ad202a540ed1ea588a13e50582379fedb1f004]
        copy: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      CGO_ENABLED: "0"
      QUICKJS_REQUIRE_JIT: "1"
    steps:
      - name: Machine
        shell: pwsh
        run: |
          $p = Get-CimInstance Win32_Processor
          "CPU: " + $p.Name + " | " + $p.Caption
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: Loop
        working-directory: internal/jit/verify
        shell: bash
        run: |
          go test -tags quickjs_jit -c -o verify.test.exe .
          fails=0
          for i in $(seq 1 30); do
            if ! ./verify.test.exe -test.count=1 > out.txt 2>&1; then
              fails=$((fails+1)); echo "run $i FAILED"; grep -aE "fatal|fault|unsupported|FAIL:|ssa.go|\.go:[0-9]+ " out.txt | head -6
            fi
          done
          echo "FAILS=$fails/30"
